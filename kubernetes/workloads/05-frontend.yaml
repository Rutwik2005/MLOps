apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox
          command: ["sh", "-c", "until nc -z backend 8000; do echo waiting for backend; sleep 2; done;"]
      containers:
        - name: frontend
          image: mlops-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mlops
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
