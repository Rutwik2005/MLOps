apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: postgres:15
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U mlops; do echo waiting for db; sleep 2; done;"]
      containers:
        - name: mlflow
          image: mlops-mlflow:latest
          imagePullPolicy: Never
          command: ["mlflow", "server"]
          args:
            - "--backend-store-uri"
            - "$(DATABASE_URL)"
            - "--default-artifact-root"
            - "s3://mlflow-artifacts"
            - "--host"
            - "0.0.0.0"
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mlops-secret
                  key: DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlops-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: MLFLOW_S3_IGNORE_TLS
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: MLFLOW_S3_IGNORE_TLS
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: mlflow
